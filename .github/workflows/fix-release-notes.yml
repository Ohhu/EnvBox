name: Fix v1.0.0 release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-release-notes.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## EnvBox 1.0.0

          原生 macOS 环境变量管理器，支持加密配置库、配置快速切换与本机环境自动采集。

          ### 安装

          1. 下载 `EnvBox-1.0.0-macOS-universal.dmg`
          2. 打开后把 EnvBox 拖入 Applications
          3. 启动 EnvBox，按需启用 Zsh 集成并应用配置

          > 首次启动如被系统拦截，请在 Finder 中右键选择“打开”。

          ### 系统要求

          - macOS 14 Sonoma 或更高版本
          - Apple Silicon 与 Intel 通用二进制

          ### 校验

          校验值见随附的 `SHA256SUMS.txt`。

          ### 安全说明

          - 配置库与导出文件均加密保存；主密钥存放在 macOS 钥匙串。
          - 应用不联网、不包含遥测。
          - 启用 Shell 集成后，`~/.envbox/active.zsh` 会以明文保存变量（权限 0600）；移除集成会删除该文件。
          EOF
          gh release edit v1.0.0 --notes-file notes.md
